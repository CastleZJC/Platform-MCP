[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Platform-MCP"
version = "3.0.1"
description = "内部 MCP 能力平台 - V3.0（Database / Server Skill + 多语种 + 运行时配置中心）"
requires-python = ">=3.11.9,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.2",
    "mcp==1.9.4",
    "oracledb==2.4.1",
    "aiomysql==0.2.0",
    "cryptography==43.0.1",
    "passlib==1.7.4",
    "bcrypt==4.2.0",
    "python-multipart==0.0.9",
    "loguru==0.7.2",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "pyyaml==6.0.2",
    "uvicorn[standard]==0.30.6",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.9",
    "sqlparse==0.5.0",
    "asyncssh==2.17.0",
    "py7zr==0.22.0",
    "aiosmtplib==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "black==24.8.0",
    "isort==5.13.2",
    "mypy==1.11.2",
    "types-PyYAML==6.0.12.20260815",
]
# V3.0 M3（架构 §19.5.6）：广场语义搜索向量栈 —— BGE-M3 经 fastembed（ONNX Runtime CPU int8，无 torch）。
# V3.0 M4（架构 §19.5.6）：本地生成模型栈 —— Qwen3-4B-Instruct GGUF 经 llama-cpp-python（纯 CPU）。
# 非核心依赖：仅生产配置 settings.skill.embedding_model_path / llm_model_path 指向离线权重时才需
# 安装（`pip install .[model]`）；缺失时 embedding.py / llm 模块 lazy import 自动降级（哈希向量 /
# 确定性模板），dev/test 与无权重生产环境无需安装（VNF-03 不联网）。
model = [
    "fastembed==0.3.6",
    "llama-cpp-python==0.3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.coverage.run]
omit = [
    "platform_mcp/common/models.py",
    "platform_mcp/mcp_server/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# Per-module coverage gates (CLAUDE.md requirement):
#   skills.database, mcp_server, auth, common >= 90%
#   other modules >= 80%
# Enforced by: python scripts/check_coverage.py

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# 测试代码宽松（不强制注解）
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# poc / scripts 工具脚本宽松
[[tool.mypy.overrides]]
module = ["poc.*", "scripts.*"]
ignore_errors = true

# 三方库无类型 stub
[[tool.mypy.overrides]]
module = ["oracledb.*", "aiomysql.*", "passlib.*", "asyncssh.*", "sqlparse.*", "loguru.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["platform_mcp*"]
exclude = ["poc*", "documents*", "PostgreSQL*", "tests*"]
